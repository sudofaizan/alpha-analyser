<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — AlphaANALYSER</title>
  <link rel="stylesheet" href="/src/auth-pages.css" />
</head>
<body>
  <div class="admin-page">
    <div class="admin-top">
      <h1>AlphaANALYSER Admin</h1>
      <div class="admin-actions">
        <button class="admin-btn" type="button" id="btnDashboard">Dashboard</button>
        <button class="admin-btn" type="button" id="btnLogout">Logout</button>
      </div>
    </div>

    <div class="admin-panel">
      <h2>Add / approve user</h2>
      <div class="admin-grid">
        <div class="auth-field">
          <label for="newEmail">Email</label>
          <input id="newEmail" type="email" placeholder="user@example.com" />
        </div>
        <div class="auth-field">
          <label for="newExpiry">Subscription expires</label>
          <input id="newExpiry" type="date" />
        </div>
        <div class="auth-field">
          <label for="newPassword">Temp password (optional)</label>
          <input id="newPassword" type="text" placeholder="changeme123" />
        </div>
        <div class="auth-field" style="display:flex;align-items:flex-end">
          <label style="display:flex;align-items:center;gap:.45rem;cursor:pointer">
            <input id="newAllowed" type="checkbox" checked /> Email allowed
          </label>
        </div>
      </div>
      <button class="admin-btn primary" type="button" id="btnAddUser">Save user</button>
      <div class="auth-msg" id="adminMsg"></div>
    </div>

    <div class="admin-panel" id="trackingPanel">
      <div class="admin-panel-head">
        <h2>Virtual tracking engine</h2>
        <button class="admin-btn" type="button" id="btnRefreshTracking">Refresh</button>
      </div>
      <div class="track-stats" id="trackStats">Loading engine status…</div>
      <div class="admin-table-wrap" style="margin-top:.75rem">
        <table class="admin-table track-table">
          <thead>
            <tr>
              <th>Signal ID</th>
              <th>User</th>
              <th>Symbol</th>
              <th>Phase</th>
              <th>Side</th>
              <th>Fill</th>
              <th>Tracking progress</th>
            </tr>
          </thead>
          <tbody id="trackActiveBody">
            <tr><td colspan="7">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <h3 class="admin-subhead">Recently closed</h3>
      <div class="admin-table-wrap">
        <table class="admin-table track-table">
          <thead>
            <tr>
              <th>Signal ID</th>
              <th>User</th>
              <th>Outcome</th>
              <th>Symbol</th>
              <th>Closed</th>
            </tr>
          </thead>
          <tbody id="trackClosedBody">
            <tr><td colspan="5">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="admin-panel">
      <h2>Users</h2>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Telegram</th>
              <th>Allowed</th>
              <th>Expires</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersBody">
            <tr><td colspan="7">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script type="module" src="/src/admin.ts"></script>
</body>
</html>
